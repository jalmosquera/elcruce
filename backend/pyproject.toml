readme = "README.md"
authors = [{ name = "jalbertth", email = "jmosquera2305@gmail.com" }]
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.20.0",
  "fastapi[standard]>=0.143.1",
